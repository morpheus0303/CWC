<style>
/* Collaborative Women's Care · brand proposal site
   Tokens mirror the CWC design system (8-color palette, v2). */
:root {
  --navy: #1B2E4A;
  --navy-deep: #14243B;
  --navy-card: #22385A;
  --sky: #8BBBDA;
  --blue: #285A7C;
  --blue-hover: #1F4863;
  --blush: #E7C6BC;
  --cream: #FAF7F2;
  --white: #FFFFFF;
  --pale: #E8F2F8;
  --slate: #4A5561;
  --line: #DCD6CC;
  --line-strong: #7B8691;
  --on-navy: #C9D3DC;
  --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-sans: 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-label: 'Josefin Sans', 'Nunito Sans', Arial, sans-serif;
  --radius-md: 12px;
  --radius-lg: 24px;
  --shadow: 0 1px 2px rgba(27,46,74,.06), 0 8px 24px rgba(27,46,74,.08);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--cream);
  color: var(--navy);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); }
a:hover { color: var(--blue-hover); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eyebrow {
  font-family: var(--font-label);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--blue);
}
.display { font-family: var(--font-display); font-weight: 500; line-height: 1; margin: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 26px; border-radius: 999px;
  background: var(--blue); color: #fff; font-weight: 700; font-size: 15px;
  text-decoration: none; border: 2px solid var(--blue); cursor: pointer;
  font-family: var(--font-sans);
}
.btn:hover { background: var(--blue-hover); border-color: var(--blue-hover); color: #fff; }
.btn.ghost { background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--pale); color: var(--blue-hover); }
.btn.small { min-height: 40px; padding: 0 18px; font-size: 14px; }

/* ---------- review bar (top of every inner page) ---------- */
.reviewbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 20px; background: var(--navy); color: var(--on-navy);
  font-size: 14px; flex-wrap: wrap;
}
.reviewbar a { color: #fff; text-decoration: none; font-weight: 700; }
.reviewbar .left, .reviewbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.reviewbar .title { color: #fff; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.reviewbar .back { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(139,187,218,.5); }
.reviewbar .back:hover { background: var(--navy-card); color: #fff; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--navy-deep); border: 1px solid var(--navy-card); }
.seg button, .seg a {
  border: 0; background: transparent; color: var(--on-navy); min-height: 36px; padding: 0 14px;
  border-radius: 999px; font: 700 13px var(--font-sans); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center;
}
.seg [aria-pressed="true"], .seg [aria-current="page"] { background: var(--sky); color: var(--navy); }
.tip { color: var(--on-navy); font-size: 13px; }
.tip b { color: #fff; }

</style>
<script>
/* Access phrase gate.
   A courtesy lock for a private review, not real security: anyone with the files can read them.
   The phrase is stored only as a SHA-256 hash. */
(function () {
  var HASH = '304528b7f627f4d57e2f066ea2a96602caecdb8ee424445f5e9e626435b5cb5a';
  var KEY = 'cwc-review-unlocked';

  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var maxWord = Math.pow(2, 32), result = '', words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], primeCounter = 0, isComposite = {}, i, j;
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
        hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return '';
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((bitLen / maxWord) | 0);
    words[words.length] = (bitLen);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
    }
    return result;
  }

  function read() {
    try { if (localStorage.getItem(KEY) === '1') return true; } catch (e) {}
    try { if (sessionStorage.getItem(KEY) === '1') return true; } catch (e) {}
    return false;
  }
  function write() {
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }
  function storageWorks() {
    try { localStorage.setItem('cwc-t', '1'); localStorage.removeItem('cwc-t'); return true; } catch (e) {}
    try { sessionStorage.setItem('cwc-t', '1'); sessionStorage.removeItem('cwc-t'); return true; } catch (e) {}
    return false;
  }

  window.CWCGate = {
    check: function (phrase) {
      var ok = sha256(String(phrase || '').trim().toLowerCase()) === HASH;
      if (ok) write();
      return ok;
    },
    unlocked: read,
    lock: function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      try { sessionStorage.removeItem(KEY); } catch (e) {}
    },
    // Inner pages: send visitors who have not entered the phrase back to the welcome screen.
    // If the browser blocks storage entirely, do not trap the visitor.
    guard: function () {
      if (!read() && storageWorks()) {
        var here = location.pathname.split('/').pop() || '';
        location.replace('index.html#next=' + encodeURIComponent(here + location.hash));
      }
    },
    _sha256: sha256
  };
})();

</script>

.phone .screen { width: 390px; height: min(844px, calc(100vh - 160px)); min-height: 520px; overflow-y: auto; overflow-x: hidden; border-radius: 40px; background: #FAF7F2; padding-top: 34px; }
.phone .screen::-webkit-scrollbar { width: 0; }
.caption { text-align: center; color: var(--slate); font-size: 14px; margin: 14px 0 0; }
.pv [hidden] { display: none !important; }
.badge2 { background: var(--sky); color: var(--navy); font: 700 12px var(--font-sans); padding: 4px 10px; border-radius: 999px; }
.mock button { font-family: inherit; cursor: pointer; }
@media (max-width: 460px) { .phone { width: 100%; border-radius: 0; padding: 0; background: none; box-shadow: none; } .phone::before { display: none; } .phone .screen { width: 100%; border-radius: 0; height: auto; padding-top: 0; overflow: visible; } .view { padding: 0 0 40px; } }

      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
      if (/^on[a-z]+$/.test(name)) {
        el.removeAttribute(name);
        var w = WHOLE.exec(val), fn = w ? get(scope, w[1]) : null;
        if (typeof fn === 'function') el.addEventListener(name.slice(2), function (e) { fn(e); });
        return;
      }
      if (val.indexOf('{{') >= 0) el.setAttribute(name, interp(val, scope));
    });
    renderChildren(node, el, scope);
    out.appendChild(el);
  }

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (patch) {
    var next = typeof patch === 'function' ? patch(this.state) : patch;
    for (var k in next) if (Object.prototype.hasOwnProperty.call(next, k)) this.state[k] = next[k];
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };

  window.dcMount = function (tplId, srcId, boxId) {
    var tpl = document.getElementById(tplId);
    var src = document.getElementById(srcId).textContent;
    var Component = new Function('DCLogic', src + '\n;return Component;')(DCLogic);
    var inst = new Component({});
    var box = document.getElementById(boxId);
    inst.__render = function () {
      var vals = inst.renderVals ? inst.renderVals() : {};
      var frag = document.createDocumentFragment();
      renderChildren(tpl.content, frag, vals);
      while (box.firstChild) box.removeChild(box.firstChild);
      box.appendChild(frag);
      if (window.cwcFixLogos) window.cwcFixLogos(box);
    };
    inst.__render();
    if (inst.componentDidMount) inst.componentDidMount();
    return inst;
  };
})();

</script>
<script>
(function () {
  dcMount('t-desk', 's-desk', 'dbox');
  dcMount('t-mob', 's-mob', 'mbox');
  var dwrap = document.getElementById('dwrap'), dbox = document.getElementById('dbox');
  function fit() {
    var avail = Math.min(1440, document.documentElement.clientWidth - 40);
    var k = avail / 1440;
    var h = dbox.firstElementChild ? dbox.firstElementChild.offsetHeight : 4000;
    dbox.style.transform = 'scale(' + k + ')';
    dwrap.style.width = (1440 * k) + 'px';
    dwrap.style.height = (h * k) + 'px';
  }
  function mode(m) {
    var mob = m === 'mobile';
    document.getElementById('v-desk').hidden = mob;
    document.getElementById('v-mob').hidden = !mob;
    document.getElementById('b-desk').setAttribute('aria-pressed', mob ? 'false' : 'true');
    document.getElementById('b-mob').setAttribute('aria-pressed', mob ? 'true' : 'false');
    try { sessionStorage.setItem('cwc-view', m); } catch (e) {}
    if (!mob) fit();
  }
  document.getElementById('b-desk').addEventListener('click', function () { mode('desktop'); });
  document.getElementById('b-mob').addEventListener('click', function () { mode('mobile'); });
  // Links inside the mockup: in-page anchors scroll; placeholders do nothing; real sites open in a new tab.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.mock a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (href.charAt(0) === '#') {
      e.preventDefault();
      var box = a.closest('.mock'), t = href.length > 1 ? box.querySelector('[id="' + href.slice(1) + '"]') : null;
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    else if (/^tel:/.test(href)) { e.preventDefault(); }
  });
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  var saved = null; try { saved = sessionStorage.getItem('cwc-view'); } catch (e) {}
  mode(saved || (window.innerWidth < 900 ? 'mobile' : 'desktop'));
  setTimeout(fit, 300);
})();
</script>
